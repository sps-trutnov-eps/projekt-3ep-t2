<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Přihlášení – Mini3 Launcher</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
<div class="auth-wrap">
  <div class="logo">MINI3<span>LAUNCHER</span></div>
  <div class="tagline">[ INSERT COIN TO PLAY ]</div>
  <div class="card">
    <h2>PŘIHLÁSIT SE</h2>
    <div class="error-msg">{{error}}</div>
    <form method="POST" action="/login">
      <div class="field">
        <label>JMÉNO</label>
        <input type="text" name="username" placeholder="hráč..." autocomplete="username" required>
      </div>
      <div class="field">
        <label>HESLO</label>
        <input type="password" name="password" placeholder="••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn">▶ VSTOUPIT</button>
    </form>
    <div class="auth-link">Nemáš účet? <a href="/register">Registruj se</a></div>
  </div>
</div>
</body>
</html>
