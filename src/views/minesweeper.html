<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minesweeper – Mini3 Launcher</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/games.css">
<style>
.ms-wrap { display:flex; flex-direction:column; align-items:center; gap:12px; width:100%; }
.ms-stats { display:flex; gap:20px; font-size:13px; color:var(--dim); }
.ms-stats strong { color:var(--text); }
</style>
</head>
<body class="skin-{{skin}}">
<nav>
  <a class="nav-brand" href="/menu">MINI3<span>LAUNCHER</span></a>
  <div class="nav-links">
    <a href="/menu">← Menu</a>
    <a href="/leaderboard">🏆 Žebříček</a>
    <span class="nav-user">👤 {{username}}</span>
    <form method="POST" action="/logout" style="margin:0">
      <button class="btn secondary small">ODHLÁSIT</button>
    </form>
  </div>
</nav>

<main class="game-main">
  <div class="game-header">
    <span>💣 MINESWEEPER</span>
    <button class="btn small" onclick="initBoard()">▶ NOVÁ HRA</button>
  </div>

  <div class="pup-panel">
    <div class="pup-btn" id="pup-reveal"  onclick="usePowerUp('reveal')"  title="[1] Odhal bezpečné pole">🔍<span class="pup-count" id="cnt-reveal">0</span></div>
    <div class="pup-btn" id="pup-defuse"  onclick="usePowerUp('defuse')"  title="[2] Odstraň náhodnou minu">💊<span class="pup-count" id="cnt-defuse">0</span></div>
    <div class="pup-btn" id="pup-scanner" onclick="usePowerUp('scanner')" title="[3] Zvýrazni oblast s minou">📡<span class="pup-count" id="cnt-scanner">0</span></div>
  </div>

  <div class="ms-wrap">
    <div class="ms-stats">
      <span>💣 Miny: <strong id="mineCount">10</strong></span>
      <span>⏱ Čas: <strong id="timer">0</strong>s</span>
    </div>
    <div id="board" class="ms-board"></div>
  </div>

  <div id="gameOver" class="game-over hidden">
    <h2 id="goTitle">VÝHRA! 🎉</h2>
    <p>Skóre: <strong id="finalScore">0</strong></p>
    <p id="saveStatus" class="save-status"></p>
    <div class="go-btns">
      <button class="btn" onclick="initBoard()">▶ HRÁT ZNOVU</button>
      <a href="/leaderboard" class="btn secondary">🏆 Žebříček</a>
    </div>
  </div>

  <div class="controls-hint">Levé klik = odkrýt &nbsp;|&nbsp; Pravé klik = vlajka 🚩 &nbsp;|&nbsp; 1/2/3 = power-up</div>
</main>

<script>
const ROWS=9, COLS=9, MINES=10;
let board, revealed, flagged, gameActive, startTime, timerInterval, firstClick;
let scannerHighlight = null;
let powerUps = { reveal:0, defuse:0, scanner:0 };

async function loadPowerUps() {
  try {
    const r=await fetch('/api/powerups');
    const list=await r.json();
    powerUps={reveal:0,defuse:0,scanner:0};
    list.forEach(p=>{if(powerUps[p.type]!==undefined)powerUps[p.type]=p.amount;});
    updatePupUI();
  } catch {}
}
loadPowerUps();

function updatePupUI() {
  ['reveal','defuse','scanner'].forEach(t=>{
    document.getElementById('cnt-'+t).textContent=powerUps[t];
    document.getElementById('pup-'+t).classList.toggle('empty',powerUps[t]<1);
  });
}

async function usePowerUp(type) {
  if (!gameActive||powerUps[type]<1) return;
  const r=await fetch('/api/powerups/use',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type})});
  if(!(await r.json()).ok) return;
  powerUps[type]--; updatePupUI();

  if (type==='reveal') {
    // Najdi náhodné bezpečné neodkryté pole a odhal ho
    const safe=[];
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++)
      if(!revealed[r][c]&&!flagged[r][c]&&board[r][c]!==-1) safe.push([r,c]);
    if(safe.length) { const [r,c]=safe[Math.floor(Math.random()*safe.length)]; reveal(r,c,true); }
    showToast('🔍 BEZPEČNÉ POLE!','#00ff88');
  }
  if (type==='defuse') {
    // Odstraň jednu náhodnou minu (změň na 0, přepočítej sousedy)
    if (firstClick) return showToast('⚠️ Nejdřív klikni na pole!','#ff8844');
    const mines=[];
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++)
      if(board[r][c]===-1&&!flagged[r][c]) mines.push([r,c]);
    if (!mines.length) return;
    const [mr,mc]=mines[Math.floor(Math.random()*mines.length)];
    board[mr][mc]=0;
    // Přepočítej okolní buňky
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++)
      if(board[r][c]!==-1) {
        let cnt=0; neighbors(r,c).forEach(([nr,nc])=>{if(board[nr][nc]===-1)cnt++;});
        board[r][c]=cnt;
      }
    renderBoard();
    document.getElementById('mineCount').textContent=mines.length-1;
    showToast('💊 MINA ZNEŠKODNĚNA!','#ffaa44');
  }
  if (type==='scanner') {
    // Zvýrazni oblast 3x3 obsahující minu
    if (firstClick) return showToast('⚠️ Nejdřív klikni na pole!','#ff8844');
    const mines=[];
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++)
      if(board[r][c]===-1&&!revealed[r][c]) mines.push([r,c]);
    if (!mines.length) return;
    const [mr,mc]=mines[Math.floor(Math.random()*mines.length)];
    scannerHighlight={r:mr,c:mc};
    renderBoard();
    showToast('📡 MINA DETEKOVÁNA!','#ff4466');
    setTimeout(()=>{scannerHighlight=null; renderBoard();},4000);
  }
}

function showToast(text,color) {
  const el=document.createElement('div'); el.className='effect-toast';
  el.style.cssText=`color:${color};border-color:${color}40`; el.textContent=text;
  document.querySelector('.game-main').appendChild(el);
  setTimeout(()=>el.remove(),2200);
}

function initBoard() {
  document.getElementById('gameOver').classList.add('hidden');
  document.getElementById('mineCount').textContent=MINES;
  document.getElementById('timer').textContent='0';
  clearInterval(timerInterval); firstClick=true; gameActive=true; scannerHighlight=null;
  board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  revealed=Array.from({length:ROWS},()=>Array(COLS).fill(false));
  flagged=Array.from({length:ROWS},()=>Array(COLS).fill(false));
  renderBoard(); loadPowerUps();
}

function placeMines(sr,sc) {
  let placed=0;
  while(placed<MINES){
    const r=Math.floor(Math.random()*ROWS), c=Math.floor(Math.random()*COLS);
    if(board[r][c]===-1) continue;
    if(Math.abs(r-sr)<=1&&Math.abs(c-sc)<=1) continue;
    board[r][c]=-1; placed++;
  }
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++)
    if(board[r][c]!==-1){let cnt=0;neighbors(r,c).forEach(([nr,nc])=>{if(board[nr][nc]===-1)cnt++;});board[r][c]=cnt;}
}

function neighbors(r,c){
  const res=[];
  for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
    if(dr===0&&dc===0) continue;
    const nr=r+dr,nc=c+dc;
    if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS) res.push([nr,nc]);
  }
  return res;
}

function reveal(r,c,fromPowerUp=false) {
  if(!gameActive||revealed[r][c]||flagged[r][c]) return;
  if(firstClick&&!fromPowerUp){
    firstClick=false; placeMines(r,c);
    startTime=Date.now();
    timerInterval=setInterval(()=>{document.getElementById('timer').textContent=Math.floor((Date.now()-startTime)/1000);},500);
  } else if(firstClick&&fromPowerUp) return; // neodhal před prvním klikem

  revealed[r][c]=true;
  if(board[r][c]===-1){revealAll();return endGame(false);}
  if(board[r][c]===0) neighbors(r,c).forEach(([nr,nc])=>{if(!revealed[nr][nc])reveal(nr,nc,fromPowerUp);});
  renderBoard(); checkWin();
}

function toggleFlag(r,c){
  if(!gameActive||revealed[r][c]) return;
  flagged[r][c]=!flagged[r][c];
  const flagCount=flagged.flat().filter(Boolean).length;
  document.getElementById('mineCount').textContent=MINES-flagCount;
  renderBoard();
}

function revealAll(){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)revealed[r][c]=true;renderBoard();}
function checkWin(){let u=0;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(!revealed[r][c])u++;if(u===MINES)endGame(true);}

const numColors=['','#4488ff','#44bb44','#ff4444','#000088','#880000','#008888','#222','#888'];

function renderBoard(){
  const boardEl=document.getElementById('board');
  boardEl.innerHTML=''; boardEl.style.gridTemplateColumns=`repeat(${COLS},1fr)`;

  // Scanner highlight area
  const scanArea=new Set();
  if(scannerHighlight){
    const {r:sr,c:sc}=scannerHighlight;
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      const nr=sr+dr,nc=sc+dc;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS) scanArea.add(nr+','+nc);
    }
  }

  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const cell=document.createElement('div'); cell.className='ms-cell';
    const inScan=scanArea.has(r+','+c);
    if(inScan) cell.style.boxShadow='inset 0 0 8px rgba(255,68,102,0.5)';

    if(revealed[r][c]){
      cell.classList.add('revealed');
      if(board[r][c]===-1){ cell.textContent='💣'; cell.style.background='#3a0000'; }
      else if(board[r][c]>0){ cell.textContent=board[r][c]; cell.style.color=numColors[board[r][c]]; }
    } else if(flagged[r][c]){ cell.classList.add('flagged'); cell.textContent='🚩'; }

    cell.addEventListener('click',()=>reveal(r,c));
    cell.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlag(r,c);});
    boardEl.appendChild(cell);
  }
}

async function endGame(won){
  gameActive=false; clearInterval(timerInterval);
  const elapsed=Math.floor((Date.now()-startTime)/1000)||1;
  const score=won?Math.max(1,Math.floor(1000/elapsed)):0;
  document.getElementById('goTitle').textContent=won?'VÝHRA! 🎉':'BOOM! 💥';
  document.getElementById('finalScore').textContent=score;
  document.getElementById('gameOver').classList.remove('hidden');

  if(won){
    const st=document.getElementById('saveStatus'); st.textContent='Ukládám skóre...';
    // Vyděl power-up za výhru
    const types=['reveal','defuse','scanner'];
    const type=types[Math.floor(Math.random()*types.length)];
    await fetch('/api/powerups/earn',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,amount:1})});
    try{
      const r=await fetch('/api/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game:'minesweeper',score})});
      st.textContent=(await r.json()).ok?'✅ Skóre uloženo!':'⚠️ Chyba.';
    } catch { st.textContent='⚠️ Chyba sítě.'; }
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='1')usePowerUp('reveal');
  if(e.key==='2')usePowerUp('defuse');
  if(e.key==='3')usePowerUp('scanner');
});

initBoard();
</script>
</body>
</html>
