<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrace – Arcade Zone</title>
<link rel="stylesheet" href="/css/style.css">
<script type="text/javascript" src="https://me.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=eCyhMBFgIDjIc8xQyXscWa75_ptlR1QmgZcXuxtCRVOYkP9xxYblRzOVuRJToJhebVytiihMvtrRHM5i2s5TUJSbgNMvlvK-BB1JfO6-ZQmy9db-vCChayFLVF2CGYSPmAyxY1IXebBVEMLvu_k_1o_v7VCq3PrzZ57sGMsgTaC9ybblNVpQmlIekqUyb03AIFTk0ULs8ACoYJV4vM9CghvXy_za9E8JBltzhYGkr5dTr-G8bUIQZP3juPATsfrXt4Pcq6cNjbC_V2XBai5DEg" charset="UTF-8"></script></head>
<body>
<div class="page">
  <div class="logo">ARCADE<span>ZONE</span></div>

  <div class="card">
    <h2>REGISTRACE</h2>

    <div class="error">{{error}}</div>
    <div class="error" id="clientError"></div>

    <form id="registerForm" method="POST" action="/register">
      <div class="field">
        <label for="username">JMÉNO</label>
        <input type="text" id="username" name="username" placeholder="nové jméno..." autocomplete="username">
      </div>
      <div class="field">
        <label for="password">HESLO</label>
        <input type="password" id="password" name="password" placeholder="••••••" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="password2">POTVRDIT HESLO</label>
        <input type="password" id="password2" name="password2" placeholder="••••••" autocomplete="new-password">
      </div>
      <button type="submit" class="btn">✚ VYTVOŘIT ÚČET</button>
    </form>

    <div class="link">Máš účet? <a href="/login">Přihlásit se</a></div>
  </div>
</div>
<script src="/js/main.js"></script>
</body>
</html>
