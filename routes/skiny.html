<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skiny – Arcade Zone</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/extras.css">
</head>
<body class="skin-{{activeSkin}}">
<nav>
  <a class="nav-brand" href="/menu">ARCADE<span>ZONE</span></a>
  <div class="nav-links">
    <a href="/menu">Menu</a>
    <a href="/statistiky">Statistiky</a>
    <a href="/leaderboard">Žebříček</a>
    <a href="/skiny" class="active">Skiny</a>
    <span class="nav-user">👤 {{username}}</span>
    <form method="POST" action="/logout" style="margin:0">
      <button class="btn secondary" style="width:auto;padding:6px 14px;font-size:10px;margin:0">ODHLÁSIT</button>
    </form>
  </div>
</nav>
<main>
  <div class="page-title">🎨 SKINY LAUNCHERU</div>
  <div style="color:var(--dim);font-size:18px;margin-bottom:4px">Vyber si vzhled – změní barvy celé aplikace.</div>

  <div class="skins-grid" id="skinsGrid"></div>
</main>

<script src="/js/main.js"></script>
<script>
const SKINS = {{skinJson}};
const active = '{{activeSkin}}';

const PREVIEWS = {
  default: ['#0a0a0f','#00ffcc','#ff00aa'],
  neon:    ['#070f07','#aaff00','#ffee00'],
  blood:   ['#0f0505','#ff2244','#ff6600'],
  ice:     ['#050a10','#44aaff','#aaeeff'],
  gold:    ['#0a0800','#ffcc00','#ff9900'],
  void:    ['#000000','#8844ff','#cc00ff'],
};

function renderSkins() {
  const grid = document.getElementById('skinsGrid');
  grid.innerHTML = '';
  SKINS.forEach(skin => {
    const [bg, border, accent] = PREVIEWS[skin.id] || ['#111','#fff','#f0f'];
    const isActive = skin.id === active;
    const div = document.createElement('div');
    div.className = 'skin-card' + (isActive ? ' active' : '') + (skin.locked ? ' locked' : '');

    const canvas = document.createElement('canvas');
    canvas.className = 'skin-preview';
    canvas.width = 160; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = bg; ctx.fillRect(0,0,160,64);
    ctx.fillStyle = border; ctx.fillRect(8,8,80,8); ctx.fillRect(8,24,50,6);
    ctx.fillStyle = accent; ctx.fillRect(110,16,36,20); ctx.fillRect(8,38,30,14);
    ctx.strokeStyle = border; ctx.lineWidth = 1.5; ctx.strokeRect(1,1,158,62);

    div.appendChild(canvas);
    div.innerHTML += `
      <div class="skin-name">${skin.name}</div>
      <div class="skin-desc">${skin.desc}</div>
      ${isActive ? '<div class="active-badge">ON</div>' : ''}
      ${skin.locked ? '<div class="skin-badge">🔒</div>' : ''}
    `;
    div.prepend(canvas);

    if (!skin.locked && !isActive) {
      div.onclick = () => {
        const f = document.createElement('form');
        f.method = 'POST'; f.action = '/skiny';
        const i = document.createElement('input');
        i.type='hidden'; i.name='skinId'; i.value=skin.id;
        f.appendChild(i); document.body.appendChild(f); f.submit();
      };
    }
    grid.appendChild(div);
  });
}
renderSkins();
</script>
</body>
</html>
